<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STEP / STL CAD Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --panel-2: #eef2f6;
      --text: #17202a;
      --muted: #687384;
      --line: #d8dee7;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --danger: #b42318;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    button,
    input {
      font: inherit;
    }

    #app {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      height: 100%;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      z-index: 3;
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 154px;
      margin-right: 6px;
      line-height: 1.2;
    }

    .brand strong {
      font-size: 15px;
      font-weight: 720;
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .toolbar button,
    .file-label,
    .toolbar-check {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      min-height: 34px;
      padding: 7px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .toolbar button:hover,
    .file-label:hover,
    .toolbar-check:hover {
      border-color: #b7c2d1;
      background: #f9fafb;
    }

    .toolbar-check {
      cursor: default;
      padding-right: 12px;
    }

    .toolbar-check input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .toolbar button.active {
      border-color: #93b4f8;
      background: var(--accent-soft);
      color: #174ea6;
    }

    #fileInput {
      display: none;
    }

    .status-chip {
      margin-left: auto;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      white-space: nowrap;
    }

    aside {
      min-width: 0;
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-head {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-head h1 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 760;
    }

    .sidebar-head p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    #partsList {
      overflow: auto;
      padding: 8px;
    }

    .empty {
      color: var(--muted);
      line-height: 1.5;
      padding: 18px 8px;
    }

    .file-group + .file-group {
      margin-top: 10px;
    }

    .file-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 26px;
      gap: 8px;
      align-items: center;
      padding: 7px 8px 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      text-transform: uppercase;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-file {
      width: 24px;
      height: 24px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
    }

    .remove-file:hover {
      border-color: #f1aaa4;
      background: #fff7f6;
      color: var(--danger);
    }

    .part-row {
      display: grid;
      grid-template-columns: 22px 30px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 7px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
    }

    .part-row:hover {
      background: #f7f9fc;
    }

    .part-row.selected {
      background: var(--accent-soft);
      border-color: #b6cdfb;
    }

    .part-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .part-row input[type="color"] {
      width: 26px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .part-name {
      overflow: hidden;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 3px 2px;
    }

    main {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(245, 247, 250, 0.78)),
        radial-gradient(circle at 30% 20%, rgba(184, 209, 255, 0.24), transparent 36%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    #message {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      max-width: min(680px, calc(100% - 32px));
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      color: var(--text);
      line-height: 1.4;
      z-index: 2;
    }

    #message:empty {
      display: none;
    }

    #message.error {
      border-color: #f1aaa4;
      color: var(--danger);
      background: #fff7f6;
    }

    #dropOverlay {
      position: absolute;
      inset: 16px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px dashed #7aa2f7;
      border-radius: 14px;
      background: rgba(239, 246, 255, 0.84);
      color: #174ea6;
      font-size: 18px;
      font-weight: 700;
      z-index: 4;
      pointer-events: none;
    }

    body.dragging #dropOverlay {
      display: flex;
    }

    @media (max-width: 760px) {
      #app {
        grid-template-columns: 220px minmax(0, 1fr);
      }

      .brand {
        min-width: 120px;
      }

      .status-chip {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <strong>CAD Viewer</strong>
        <span>STEP and STL, units: mm</span>
      </div>
      <div class="toolbar" aria-label="Viewer toolbar">
        <label class="file-label" for="fileInput">Open Files</label>
        <input id="fileInput" type="file" accept=".step,.stp,.stl" multiple>
        <label class="toolbar-check">
          <input id="replaceOnOpen" type="checkbox" checked>
          Replace on open
        </label>
        <button id="fitBtn" type="button">Fit View</button>
        <button id="resetBtn" type="button">Reset</button>
        <button id="clearBtn" type="button">Clear</button>
        <button id="wireBtn" type="button" aria-pressed="false">Wireframe</button>
        <button id="edgesBtn" type="button" aria-pressed="true" class="active">Edges</button>
        <button id="gridBtn" type="button" aria-pressed="true" class="active">Grid/Axes</button>
        <span id="boundsNote" class="status-chip">Size: no model loaded</span>
      </div>
    </header>

    <aside>
      <div class="sidebar-head">
        <h1>Parts</h1>
        <p>Toggle bodies, adjust colors, or select a name to highlight it.</p>
      </div>
      <div id="partsList">
        <div class="empty">Open or drop a STEP/STP/STL file to begin.</div>
      </div>
    </aside>

    <main id="viewport">
      <div id="message"></div>
      <div id="dropOverlay">Drop STEP, STP, or STL files anywhere</div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const viewport = document.querySelector('#viewport');
    const fileInput = document.querySelector('#fileInput');
    const partsList = document.querySelector('#partsList');
    const message = document.querySelector('#message');
    const boundsNote = document.querySelector('#boundsNote');
    const replaceOnOpen = document.querySelector('#replaceOnOpen');
    const fitBtn = document.querySelector('#fitBtn');
    const resetBtn = document.querySelector('#resetBtn');
    const clearBtn = document.querySelector('#clearBtn');
    const wireBtn = document.querySelector('#wireBtn');
    const edgesBtn = document.querySelector('#edgesBtn');
    const gridBtn = document.querySelector('#gridBtn');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f7fa);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
    const defaultCameraDirection = new THREE.Vector3(0.85, 0.62, 0.85).normalize();
    camera.position.copy(defaultCameraDirection).multiplyScalar(330);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;

    const root = new THREE.Group();
    root.rotation.x = -Math.PI / 2;
    scene.add(root);

    const grid = new THREE.GridHelper(400, 40, 0x98a2b3, 0xd3d9e3);
    grid.position.y = -0.001;
    scene.add(grid);

    const axes = new THREE.AxesHelper(120);
    scene.add(axes);

    const selectionBox = new THREE.BoxHelper(new THREE.Object3D(), 0x2563eb);
    selectionBox.visible = false;
    scene.add(selectionBox);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c2d1, 1.7));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(250, 320, 180);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
    fillLight.position.set(-180, 120, -240);
    scene.add(fillLight);

    const stlLoader = new STLLoader();
    let occtModulePromise = null;
    let loadedFiles = [];
    let parts = [];
    let selectedPart = null;
    let nextFileId = 1;
    let nextPartId = 1;
    let showWireframe = false;
    let showEdges = true;
    let showGridAxes = true;

    const palette = [
      '#6ea8fe', '#95d5b2', '#ffd166', '#f4978e', '#b8a1ff',
      '#80ced7', '#f4a261', '#a8dadc', '#cdb4db', '#90be6d'
    ];

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
    }

    function clearMessageSoon() {
      window.setTimeout(() => {
        if (!message.classList.contains('error')) {
          setMessage('');
        }
      }, 2500);
    }

    function setToggle(button, enabled) {
      button.classList.toggle('active', enabled);
      button.setAttribute('aria-pressed', String(enabled));
    }

    function getOcctModule() {
      if (!occtModulePromise) {
        if (typeof window.occtimportjs !== 'function') {
          throw new Error('occt-import-js did not load from the CDN.');
        }
        occtModulePromise = window.occtimportjs({
          locateFile: (fileName) => `https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/${fileName}`
        });
      }
      return occtModulePromise;
    }

    function colorFromOcct(mesh, index) {
      const color = mesh.color || mesh.face_colors?.[0] || mesh.faceColors?.[0];
      if (Array.isArray(color) && color.length >= 3) {
        const [r, g, b] = color;
        return new THREE.Color(r > 1 ? r / 255 : r, g > 1 ? g / 255 : g, b > 1 ? b / 255 : b).getHexString();
      }
      return palette[index % palette.length].slice(1);
    }

    function makeMaterial(hex) {
      return new THREE.MeshStandardMaterial({
        color: `#${hex}`,
        metalness: 0.05,
        roughness: 0.72,
        side: THREE.DoubleSide,
        wireframe: showWireframe
      });
    }

    function addEdges(mesh, visible = showEdges) {
      const edgesGeometry = new THREE.EdgesGeometry(mesh.geometry, 25);
      const edges = new THREE.LineSegments(
        edgesGeometry,
        new THREE.LineBasicMaterial({ color: 0x2f3a4a, transparent: true, opacity: 0.38 })
      );
      edges.visible = visible;
      mesh.add(edges);
      return edges;
    }

    function disposeObject(object) {
      object.traverse((child) => {
        if (child.geometry) {
          child.geometry.dispose();
        }
        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach((material) => material.dispose());
          } else {
            child.material.dispose();
          }
        }
      });
    }

    function resetCamera() {
      camera.near = 0.1;
      camera.far = 100000;
      camera.updateProjectionMatrix();
      camera.position.copy(defaultCameraDirection).multiplyScalar(330);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function removeParts(fileParts) {
      for (const part of fileParts) {
        root.remove(part.mesh);
        disposeObject(part.mesh);
      }
    }

    function clearScene(statusText = 'No model loaded.') {
      removeParts(parts);
      root.position.set(0, 0, 0);
      loadedFiles = [];
      parts = [];
      selectedPart = null;
      selectionBox.visible = false;
      renderPartsList();
      updateBounds();
      resetCamera();
      setMessage(statusText);
    }

    function createLoadedFile(fileName) {
      const loadedFile = {
        id: `file-${nextFileId++}`,
        name: fileName,
        parts: []
      };
      loadedFiles.push(loadedFile);
      return loadedFile;
    }

    function createPart(loadedFile, mesh, name, colorHex) {
      mesh.name = name;
      mesh.material = makeMaterial(colorHex);
      mesh.geometry.computeVertexNormals();
      mesh.geometry.computeBoundingBox();
      const edges = addEdges(mesh);
      root.add(mesh);

      const part = {
        id: `part-${nextPartId++}`,
        fileId: loadedFile.id,
        name,
        mesh,
        edges,
        color: `#${colorHex}`,
        visible: true
      };
      parts.push(part);
      loadedFile.parts.push(part);
      return part;
    }

    function geometryFromOcctMesh(occtMesh) {
      const attributes = occtMesh.attributes || {};
      const positionSource = attributes.position || attributes.positions || occtMesh.position || occtMesh.positions;
      const normalSource = attributes.normal || attributes.normals || occtMesh.normal || occtMesh.normals;
      const indexSource = occtMesh.index || occtMesh.indices || attributes.index;

      const positions = positionSource?.array || positionSource;
      const normals = normalSource?.array || normalSource;
      const indices = indexSource?.array || indexSource;

      if (!positions || positions.length === 0) {
        throw new Error('A STEP mesh did not contain vertex positions.');
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      if (normals && normals.length === positions.length) {
        geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      }
      if (indices && indices.length > 0) {
        geometry.setIndex(Array.from(indices));
      }
      if (!geometry.attributes.normal) {
        geometry.computeVertexNormals();
      }
      geometry.computeBoundingBox();
      return geometry;
    }

    async function loadStepFile(loadedFile, arrayBuffer) {
      const fileName = loadedFile.name;
      setMessage(`Parsing ${fileName}. STEP files can take a few seconds...`);
      const occt = await getOcctModule();
      const params = {
        linearUnit: 'millimeter',
        linearDeflectionType: 'bounding_box_ratio',
        linearDeflection: 0.001,
        angularDeflection: 0.5
      };
      const result = occt.ReadStepFile(new Uint8Array(arrayBuffer), params);
      if (!result || result.success === false || !Array.isArray(result.meshes)) {
        throw new Error(result?.error || `Could not parse ${fileName} as STEP.`);
      }

      result.meshes.forEach((occtMesh, index) => {
        const geometry = geometryFromOcctMesh(occtMesh);
        const mesh = new THREE.Mesh(geometry);
        const fallbackName = `${fileName} body ${index + 1}`;
        const name = occtMesh.name || occtMesh.nodeName || occtMesh.productName || fallbackName;
        createPart(loadedFile, mesh, name, colorFromOcct(occtMesh, index));
      });
    }

    function loadStlFile(loadedFile, arrayBuffer) {
      const geometry = stlLoader.parse(arrayBuffer);
      geometry.computeVertexNormals();
      geometry.computeBoundingBox();
      const mesh = new THREE.Mesh(geometry);
      createPart(loadedFile, mesh, loadedFile.name, palette[parts.length % palette.length].slice(1));
    }

    async function loadFileLike(fileName, arrayBuffer) {
      const loadedFile = createLoadedFile(fileName);
      try {
        const extension = fileName.split('.').pop().toLowerCase();
        if (extension === 'step' || extension === 'stp') {
          await loadStepFile(loadedFile, arrayBuffer);
        } else if (extension === 'stl') {
          loadStlFile(loadedFile, arrayBuffer);
        } else {
          throw new Error(`${fileName} is not a STEP, STP, or STL file.`);
        }
        if (loadedFile.parts.length === 0) {
          throw new Error(`${fileName} did not contain any displayable meshes.`);
        }
      } catch (error) {
        removeLoadedFile(loadedFile, { silent: true });
        throw error;
      }
    }

    async function loadFiles(files, replaceScene = replaceOnOpen.checked) {
      const supported = Array.from(files).filter((file) => /\.(step|stp|stl)$/i.test(file.name));
      if (supported.length === 0) {
        setMessage('No supported STEP, STP, or STL files were found.', true);
        return;
      }

      if (replaceScene) {
        clearScene('');
      }

      try {
        for (const file of supported) {
          setMessage(`Loading ${file.name}...`);
          await loadFileLike(file.name, await file.arrayBuffer());
        }
        finishLoad(`${supported.length} file${supported.length === 1 ? '' : 's'} loaded.`);
      } catch (error) {
        console.error(error);
        setMessage(error.message || 'The file could not be loaded.', true);
      }
    }

    async function loadFromUrl(relativeUrl) {
      if (/^[a-z][a-z0-9+.-]*:/i.test(relativeUrl) || relativeUrl.startsWith('//')) {
        setMessage('The ?file= parameter must be a relative URL.', true);
        return;
      }

      clearScene('');
      try {
        setMessage(`Fetching ${relativeUrl}...`);
        const response = await fetch(relativeUrl);
        if (!response.ok) {
          throw new Error(`Fetch failed for ${relativeUrl}: ${response.status} ${response.statusText}`);
        }
        const fileName = relativeUrl.split('/').pop() || 'model.step';
        await loadFileLike(fileName, await response.arrayBuffer());
        finishLoad(`${fileName} loaded.`);
      } catch (error) {
        console.error(error);
        setMessage(error.message || 'The URL file could not be loaded.', true);
      }
    }

    function finishLoad(text) {
      renderPartsList();
      updateSceneMatrices();
      normalizeRootToGround();
      updateSceneMatrices();
      updateBounds();
      fitView();
      setMessage(text);
      clearMessageSoon();
    }

    function updateSceneMatrices() {
      root.updateMatrixWorld(true);
      scene.updateMatrixWorld(true);
    }

    function normalizeRootToGround() {
      root.position.set(0, 0, 0);
      updateSceneMatrices();
      const box = new THREE.Box3().setFromObject(root);
      if (box.isEmpty()) {
        return;
      }
      root.position.y -= box.min.y;
    }

    function renderPartsList() {
      partsList.textContent = '';
      if (loadedFiles.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Open or drop a STEP/STP/STL file to begin.';
        partsList.appendChild(empty);
        return;
      }

      for (const loadedFile of loadedFiles) {
        const group = document.createElement('section');
        group.className = 'file-group';

        const header = document.createElement('div');
        header.className = 'file-header';

        const fileName = document.createElement('div');
        fileName.className = 'file-name';
        fileName.textContent = loadedFile.name;
        fileName.title = loadedFile.name;

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'remove-file';
        removeButton.textContent = 'x';
        removeButton.title = `Remove ${loadedFile.name}`;
        removeButton.setAttribute('aria-label', `Remove ${loadedFile.name}`);
        removeButton.addEventListener('click', () => removeLoadedFile(loadedFile));

        header.append(fileName, removeButton);
        group.appendChild(header);

        for (const part of loadedFile.parts) {
          const row = document.createElement('div');
          row.className = 'part-row';
          row.classList.toggle('selected', part === selectedPart);

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = part.visible;
          checkbox.title = `Show ${part.name}`;
          checkbox.addEventListener('change', () => {
            part.visible = checkbox.checked;
            part.mesh.visible = part.visible;
            if (!part.visible && selectedPart === part) {
              selectPart(null);
            }
            updateBounds();
          });

          const swatch = document.createElement('input');
          swatch.type = 'color';
          swatch.value = part.color;
          swatch.title = `Color for ${part.name}`;
          swatch.addEventListener('input', () => {
            part.color = swatch.value;
            part.mesh.material.color.set(part.color);
          });

          const name = document.createElement('button');
          name.type = 'button';
          name.className = 'part-name';
          name.textContent = part.name;
          name.title = part.name;
          name.addEventListener('click', () => selectPart(part));

          row.append(checkbox, swatch, name);
          group.appendChild(row);
        }

        partsList.appendChild(group);
      }
    }

    function removeLoadedFile(loadedFile, options = {}) {
      const { silent = false } = options;
      const removedParts = new Set(loadedFile.parts);
      removeParts(loadedFile.parts);
      loadedFiles = loadedFiles.filter((file) => file !== loadedFile);
      parts = parts.filter((part) => !removedParts.has(part));
      if (removedParts.has(selectedPart)) {
        selectedPart = null;
        selectionBox.visible = false;
      }
      renderPartsList();
      normalizeRootToGround();
      updateSceneMatrices();
      updateBounds();
      if (parts.length > 0) {
        fitView();
      } else {
        root.position.set(0, 0, 0);
        resetCamera();
      }
      if (!silent) {
        setMessage(parts.length > 0 ? `${loadedFile.name} removed.` : 'No model loaded.');
        if (parts.length > 0) {
          clearMessageSoon();
        }
      }
    }

    function selectPart(part) {
      if (selectedPart) {
        selectedPart.mesh.material.emissive?.set(0x000000);
      }
      selectedPart = part;
      if (selectedPart && selectedPart.visible) {
        selectedPart.mesh.material.emissive?.set(0x1d4ed8);
        selectedPart.mesh.material.emissiveIntensity = 0.18;
        selectionBox.setFromObject(selectedPart.mesh);
        selectionBox.visible = true;
      } else {
        selectionBox.visible = false;
      }
      renderPartsList();
    }

    function updateBounds() {
      const box = getModelBounds();
      if (box.isEmpty()) {
        boundsNote.textContent = 'Size: no model loaded';
        return;
      }
      const size = box.getSize(new THREE.Vector3());
      boundsNote.textContent = `Size: ${formatMm(size.x)} x ${formatMm(size.y)} x ${formatMm(size.z)} mm`;
    }

    function getModelBounds() {
      const box = new THREE.Box3();
      const partBox = new THREE.Box3();
      for (const part of parts) {
        if (part.visible) {
          if (!part.mesh.geometry.boundingBox) {
            part.mesh.geometry.computeBoundingBox();
          }
          part.mesh.updateMatrix();
          partBox.copy(part.mesh.geometry.boundingBox).applyMatrix4(part.mesh.matrix);
          box.union(partBox);
        }
      }
      return box;
    }

    function formatMm(value) {
      if (!Number.isFinite(value)) {
        return '0';
      }
      return value >= 100 ? value.toFixed(0) : value >= 10 ? value.toFixed(1) : value.toFixed(2);
    }

    function fitView(targetObject = root) {
      updateSceneMatrices();
      const box = new THREE.Box3().setFromObject(targetObject);
      if (box.isEmpty()) {
        camera.position.copy(defaultCameraDirection).multiplyScalar(330);
        controls.target.set(0, 0, 0);
        controls.update();
        return;
      }

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxSize = Math.max(size.x, size.y, size.z);
      const fitHeightDistance = maxSize / (2 * Math.atan((Math.PI * camera.fov) / 360));
      const fitWidthDistance = fitHeightDistance / camera.aspect;
      const distance = 1.6 * Math.max(fitHeightDistance, fitWidthDistance);
      const direction = defaultCameraDirection.clone();

      camera.near = Math.max(distance / 1000, 0.01);
      camera.far = Math.max(distance * 1000, 1000);
      camera.updateProjectionMatrix();
      camera.position.copy(center).add(direction.multiplyScalar(distance));
      controls.target.copy(center);
      controls.update();
    }

    function resetViewer() {
      showWireframe = false;
      showEdges = true;
      showGridAxes = true;
      setToggle(wireBtn, showWireframe);
      setToggle(edgesBtn, showEdges);
      setToggle(gridBtn, showGridAxes);
      grid.visible = true;
      axes.visible = true;
      for (const part of parts) {
        part.visible = true;
        part.mesh.visible = true;
        part.mesh.material.wireframe = false;
        part.edges.visible = true;
      }
      selectPart(null);
      renderPartsList();
      updateBounds();
      fitView();
    }

    function resize() {
      const width = viewport.clientWidth;
      const height = viewport.clientHeight;
      camera.aspect = width / Math.max(height, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      if (selectedPart && selectionBox.visible) {
        selectionBox.setFromObject(selectedPart.mesh);
      }
      renderer.render(scene, camera);
    }

    fileInput.addEventListener('change', () => {
      loadFiles(fileInput.files);
      fileInput.value = '';
    });

    fitBtn.addEventListener('click', () => fitView());
    resetBtn.addEventListener('click', resetViewer);
    clearBtn.addEventListener('click', () => clearScene());
    wireBtn.addEventListener('click', () => {
      showWireframe = !showWireframe;
      setToggle(wireBtn, showWireframe);
      parts.forEach((part) => {
        part.mesh.material.wireframe = showWireframe;
      });
    });
    edgesBtn.addEventListener('click', () => {
      showEdges = !showEdges;
      setToggle(edgesBtn, showEdges);
      parts.forEach((part) => {
        part.edges.visible = showEdges;
      });
    });
    gridBtn.addEventListener('click', () => {
      showGridAxes = !showGridAxes;
      setToggle(gridBtn, showGridAxes);
      grid.visible = showGridAxes;
      axes.visible = showGridAxes;
    });

    window.addEventListener('resize', resize);

    window.addEventListener('dragenter', (event) => {
      event.preventDefault();
      document.body.classList.add('dragging');
    });
    window.addEventListener('dragover', (event) => {
      event.preventDefault();
    });
    window.addEventListener('dragleave', (event) => {
      if (event.target === document.body || event.clientX <= 0 || event.clientY <= 0) {
        document.body.classList.remove('dragging');
      }
    });
    window.addEventListener('drop', (event) => {
      event.preventDefault();
      document.body.classList.remove('dragging');
      loadFiles(event.dataTransfer.files);
    });

    resize();
    animate();

    const params = new URLSearchParams(window.location.search);
    const queryFile = params.get('file');
    if (queryFile) {
      loadFromUrl(queryFile);
    }
  </script>
</body>
</html>
